<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="halftone" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4" cy="4" r="1.8" fill="#7a2a00"/>
    </pattern>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="512" height="512" rx="96" fill="#0d0d0d"/>
  <!-- diamond outline -->
  <rect x="106" y="106" width="300" height="300" rx="18" transform="rotate(45 256 256)" fill="none" stroke="#ff6a00" stroke-width="10"/>
  <!-- halftone side shadow -->
  <polygon points="300,56 170,280 252,280 212,456 350,212 266,212" transform="translate(16 14)" fill="url(#halftone)"/>
  <!-- bolt -->
  <polygon points="300,56 170,280 252,280 212,456 350,212 266,212" fill="url(#boltGrad)"/>
  <!-- highlight edge -->
  <polyline points="300,56 170,280" fill="none" stroke="#ffd2a0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
